<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Bevel Light Highlight -->
    <linearGradient id="bevelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>

    <!-- Monogram Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle with Neumorphic Bevel -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="60" height="60" rx="16" stroke="url(#bevelGrad)" stroke-width="2" />

  <!-- Inner Soft Bevel Ring -->
  <rect x="6" y="6" width="52" height="52" rx="12" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5" />

  <!-- Stylized Executive "K" Monogram -->
  <!-- Left Vertical Stem -->
  <rect x="18" y="16" width="6.5" height="32" rx="3.25" fill="#ffffff" />

  <!-- Upper Diagonal Wing -->
  <path d="M22 32 L36.5 17.5 C37.8 16.2 40 17.1 40 18.9 L40 21.2 C40 22.3 39.5 23.3 38.6 24.1 L29 33.5 Z" fill="url(#accentGrad)" />

  <!-- Lower Diagonal Leg -->
  <path d="M26 30 L39.2 44.2 C40.1 45.1 40.1 46.5 39.2 47.4 C38.3 48.3 36.9 48.3 36 47.4 L22 34 Z" fill="#ffffff" />

  <!-- Executive Apex Star / Diamond Dot -->
  <circle cx="43" cy="18" r="3.2" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="43" cy="18" r="1.8" fill="#ffffff" />
</svg>
